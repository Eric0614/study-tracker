<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>唸書計時器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📚</div>
    <span class="logo-text">唸書計時器</span>
  </div>
  <span id="user-badge" onclick="changeName()">👤 載入中</span>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="showPage('timer', this)">⏱ 計時</button>
  <button class="tab-btn" onclick="showPage('report', this)">📊 報表</button>
  <button class="tab-btn" onclick="showPage('subjects', this)">📝 科目</button>
</div>

<!-- Timer Page -->
<div id="page-timer" class="page active">
  <div class="timer-card">
    <div class="subject-row">
      <select id="subject-select">
        <option value="">── 選擇科目 ──</option>
      </select>
    </div>

    <div class="circle-timer" id="circle-timer">
      <svg viewBox="0 0 200 200">
        <circle class="circle-bg" cx="100" cy="100" r="90"/>
        <circle class="circle-progress" id="circle-progress" cx="100" cy="100" r="90"/>
      </svg>
      <div class="circle-inner">
        <div class="time-display" id="timer-display">00:00:00</div>
        <div class="subject-label" id="timer-subject-label">選擇科目開始</div>
      </div>
    </div>

    <button class="timer-btn start" id="main-btn" onclick="toggleTimer()">▶&nbsp; 開始唸書</button>
  </div>

  <p class="total-summary" id="timer-total-summary">載入中...</p>

  <p class="section-title">今日記錄</p>
  <div class="today-card">
    <ul class="today-list" id="today-list">
      <li class="empty-msg">今天還沒有記錄</li>
    </ul>
  </div>
</div>

<!-- Report Page -->
<div id="page-report" class="page">
  <p class="total-summary" id="report-total-summary">載入中...</p>
  <div class="report-tabs">
    <button class="report-tab active" onclick="switchReport('day', this)">每日</button>
    <button class="report-tab" onclick="switchReport('week', this)">本週</button>
    <button class="report-tab" onclick="switchReport('month', this)">本月</button>
  </div>
  <div class="goal-card" id="goal-card" style="display:none">
    <div id="goal-content"><p class="loading-msg">載入中...</p></div>
  </div>
  <div class="report-card">
    <div id="report-content"><p class="loading-msg">載入中...</p></div>
  </div>
</div>

<!-- Subjects Page -->
<div id="page-subjects" class="page">
  <div class="subjects-card">
    <p class="section-title" style="margin-bottom:14px">科目管理</p>
    <div class="subject-chips" id="subject-chips">
      <p class="loading-msg">載入中...</p>
    </div>
    <div class="add-row">
      <input type="text" id="new-subject-input" placeholder="新增科目名稱"
             onkeydown="if(event.key==='Enter') addSubject()">
      <button class="btn-add" onclick="addSubject()">新增</button>
    </div>
  </div>
</div>

<!-- Name Modal -->
<div class="modal-overlay" id="name-modal">
  <div class="modal">
    <h2>👋 嗨！</h2>
    <p>輸入你的名字<br>讓我們開始記錄你的學習時間</p>
    <input type="text" id="name-input" placeholder="你的名字"
           onkeydown="if(event.key==='Enter') saveName()">
    <button class="btn-confirm" onclick="saveName()">開始使用</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="record-format.js"></script>
<script src="app.js"></script>
</body>
</html>
